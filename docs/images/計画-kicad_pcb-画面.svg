<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="18" font-weight="bold" fill="#202124">.kicad_pcb のプレビュー画面</text>

  <!-- 1. 通常 -->
  <rect x="24" y="64" width="288" height="320" rx="6" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <rect x="32" y="72" width="272" height="304" fill="#D6D9DE"/>
  <rect x="40" y="80" width="256" height="28" rx="4" fill="#FFFFFF" stroke="#C4C7CC"/>
  <text x="48" y="99" font-size="11" fill="#202124">材質 色 背景 全体表示 ライト 計測</text>
  <rect x="226" y="84" width="64" height="20" rx="3" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="258" y="98" font-size="10" fill="#202124" text-anchor="middle">KiCad で開く</text>
  <polygon points="88,248 224,216 272,248 136,280" fill="#1E5B3F" stroke="#14402C"/>
  <rect x="136" y="232" width="24" height="14" fill="#2B2B2B"/>
  <rect x="184" y="236" width="20" height="10" fill="#C9B26B"/>
  <rect x="40" y="344" width="256" height="24" rx="4" fill="#FFFFFF" stroke="#C4C7CC"/>
  <text x="48" y="361" font-size="11" fill="#202124">board.kicad_pcb  210.6 × 40.6 × 1.6 mm</text>
  <text x="168" y="408" font-size="14" fill="#202124" text-anchor="middle">通常</text>

  <!-- 2. 書き出し中 -->
  <rect x="336" y="64" width="288" height="320" rx="6" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <rect x="344" y="72" width="272" height="304" fill="#D6D9DE"/>
  <rect x="352" y="80" width="256" height="28" rx="4" fill="#FFFFFF" stroke="#C4C7CC"/>
  <text x="360" y="99" font-size="11" fill="#202124">材質 色 背景 全体表示 ライト 計測</text>
  <rect x="538" y="84" width="64" height="20" rx="3" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="570" y="98" font-size="10" fill="#202124" text-anchor="middle">KiCad で開く</text>
  <polygon points="400,248 536,216 584,248 448,280" fill="#1E5B3F" stroke="#14402C" opacity="0.6"/>
  <rect x="352" y="344" width="256" height="24" rx="4" fill="#FFFFFF" stroke="#C4C7CC"/>
  <text x="360" y="361" font-size="11" fill="#202124">board.kicad_pcb</text>
  <text x="456" y="361" font-size="11" fill="#3B6FD8">KiCad で書き出し中…</text>
  <text x="480" y="408" font-size="14" fill="#202124" text-anchor="middle">保存して書き出し中</text>
  <text x="480" y="428" font-size="12" fill="#5F6368" text-anchor="middle">前の表示を残したまま、下の帯に状態を出す</text>

  <!-- 3. KiCad が無い -->
  <rect x="648" y="64" width="288" height="320" rx="6" fill="#F1F3F4" stroke="#80868B" stroke-width="2"/>
  <rect x="656" y="72" width="272" height="304" fill="#D6D9DE"/>
  <rect x="664" y="80" width="256" height="28" rx="4" fill="#FFFFFF" stroke="#C4C7CC"/>
  <text x="672" y="99" font-size="11" fill="#202124">材質 色 背景 全体表示 ライト 計測</text>
  <rect x="680" y="176" width="224" height="104" rx="6" fill="#FFFFFF" stroke="#D93025" stroke-width="2"/>
  <text x="792" y="204" font-size="12" fill="#202124" text-anchor="middle">KiCad が見つかりません。</text>
  <text x="792" y="222" font-size="12" fill="#202124" text-anchor="middle">KiCad をインストールしてください</text>
  <rect x="728" y="240" width="128" height="24" rx="4" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="792" y="257" font-size="11" fill="#202124" text-anchor="middle">ダウンロードページ</text>
  <text x="792" y="408" font-size="14" fill="#202124" text-anchor="middle">KiCad が無い</text>
  <text x="792" y="428" font-size="12" fill="#5F6368" text-anchor="middle">古い KiCad なら「KiCad 8 以降に更新」</text>
  <text x="792" y="446" font-size="12" fill="#5F6368" text-anchor="middle">ボタンは kicad.org を開く</text>

  <rect x="24" y="448" width="16" height="16" fill="#E8F0FE" stroke="#3B6FD8"/>
  <text x="48" y="461" font-size="12" fill="#5F6368">新しく足す部品</text>
  <rect x="160" y="448" width="16" height="16" fill="#FCE8E6" stroke="#D93025"/>
  <text x="184" y="461" font-size="12" fill="#5F6368">エラーの表示</text>
</svg>
